}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}

svg{display:block;flex-shrink:0}
b{font-weight:700}
.pos{color:var(--inc)} .neg{color:var(--exp)}

.cd .dd i{width:6px;height:6px;border-radius:50%}
.cd .dd .de{background:var(--exp)} .cd .dd .di{background:var(--inc)}
.cd.sel .dd .de{background:#FF8F77} .cd.sel .dd .di{background:#62D69D}

function loadOB(){
  try{

/* ═════════ THE LEDGER: opening → entries → closing, chained day to day ═════════ */
function rpEvents(d){
  const out=[];
  loadRP().forEach(e=>{
    const a=ACC.includes(e.acct)?e.acct:'wallet',sa=ACC.includes(e.settledAcct)?e.settledAcct:a;
    if(e.created===d)out.push(e.type==='rec'?{k:'evLend',name:e.name,amt:-e.amount,acct:a}:{k:'evBorrow',name:e.name,amt:e.amount,acct:a});
    if(e.status==='settled'&&e.settled===d)out.push(e.type==='rec'?{k:'evGot',name:e.name,amt:e.amount,acct:sa}:{k:'evRepaid',name:e.name,amt:-e.amount,acct:sa});
  });
  return out;
}
function ledger(){
  if(LC)return LC;
  const net={};
  const add=(d,a,v)=>{(net[d]=net[d]||{wallet:0,bkash:0,bank:0})[a]+=v;};
  txs.forEach(x=>{
    if(x.type==='income')add(x.date,acctOf(x),x.amount);
    else if(x.type==='expense')add(x.date,acctOf(x),-x.amount);
    else if(x.type==='transfer'&&ACC.includes(x.from)&&ACC.includes(x.to)){add(x.date,x.from,-x.amount);add(x.date,x.to,x.amount);}
  });
  loadRP().forEach(e=>{
    const a=ACC.includes(e.acct)?e.acct:'wallet',sa=ACC.includes(e.settledAcct)?e.settledAcct:a;
    if(e.created)add(e.created,a,e.type==='rec'?-e.amount:e.amount);
    if(e.status==='settled'&&e.settled)add(e.settled,sa,e.type==='rec'?e.amount:-e.amount);
  });
  LC={net,ob:loadOB()};return LC;
}
const zero=()=>({wallet:0,bkash:0,bank:0});
function netOn(d){return ledger().net[d]||zero();}
function obKeys(){return Object.keys(ledger().ob).sort();}
function openingOn(d){
  const {net,ob}=ledger(),keys=obKeys().filter(k=>k<=d);
  if(!keys.length)return null;
  const k0=keys[keys.length-1],bal=Object.assign(zero(),ob[k0]);
  if(k0===d)return bal;
  const cur=pd(k0),target=pd(d);
  while(cur<target){const n=net[ymd(cur)];if(n)ACC.forEach(a=>{bal[a]+=n[a];});cur.setDate(cur.getDate()+1);}
  return bal;
}
function closeOn(d){const o=openingOn(d);if(!o)return null;const n=netOn(d);const c={};ACC.forEach(a=>{c[a]=o[a]+n[a];});return c;}
function rangeSeries(from,to){
  const {net,ob}=ledger(),out={};
  let open=openingOn(from);
  const cur=pd(from),end=pd(to);
  while(cur<=end){
    const ds=ymd(cur);
    if(ob[ds]&&ds!==from)open=Object.assign(zero(),ob[ds]);
    if(open){const n=net[ds]||zero(),close={};ACC.forEach(a=>{close[a]=open[a]+n[a];});out[ds]={open,close};open=close;}
    else out[ds]=null;
    cur.setDate(cur.getDate()+1);
  }
  return out;
}

/* ═════════ COMPARISON MATH ═════════ */
function wkStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()-pref.weekStart+7)%7));return x;}
function period(u,off){
  const n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),n.getDate());let s,e;
  if(u==='week'){s=wkStart(d);s.setDate(s.getDate()+7*off);e=new Date(s);e.setDate(e.getDate()+6);}
  else if(u==='month'){s=new Date(d.getFullYear(),d.getMonth()+off,1);e=new Date(d.getFullYear(),d.getMonth()+off+1,0);}
  else{s=new Date(d.getFullYear()+off,0,1);e=new Date(d.getFullYear()+off,11,31);}
  return {s:ymd(s),e:ymd(e),sd:s,ed:e};
}
const spend=(s,e)=>txs.reduce((a,x)=>(x.type==='expense'&&x.date>=s&&x.date<=e)?a+x.amount:a,0);
function spanCmp(u){
  const cur=period(u,0),prev=period(u,-1),today=todayStr();
  const n=Math.round((pd(today)-cur.sd)/86400000)+1;
  const pe=new Date(prev.sd);pe.setDate(pe.getDate()+n-1);
  const peS=ymd(pe)>prev.e?prev.e:ymd(pe);
  const pn=Math.round((pd(peS)-prev.sd)/86400000)+1;
  return {cur,prev,n,pn,today,peS,curT:spend(cur.s,today),prevT:spend(prev.s,peS),prevFull:spend(prev.s,prev.e)};
}
function chgHtml(c,p,big){
  const cls='chg'+(big?' big-chg':'');
  if(!p&&!c)return `<span class="${cls}">${t('flat')}</span>`;
  if(!p)return `<span class="${cls}">${t('noPrev')}</span>`;
  const d=c-p,pc=Math.round(Math.abs(d)/p*100);
  if(Math.abs(d)<1)return `<span class="${cls}">${t('flat')}</span>`;
  return d>0?`<span class="${cls} up">${t('up',mny(d),nd(pc))}</span>`:`<span class="${cls} dn">${t('down',mny(-d),nd(pc))}</span>`;
}
function pLabel(u,p,axis){
  if(u==='year')return nd(p.sd.getFullYear());
  if(u==='month')return axis?MS()[p.sd.getMonth()]:MB()[p.sd.getMonth()]+' '+nd(p.sd.getFullYear());
  return axis?nd(p.sd.getDate())+'<br>'+MS()[p.sd.getMonth()]:rng(p.s,p.e);
}

function cmpPage(seg){
  const u=S.cmpUnit,sc=spanCmp(u),cur=sc.cur;
  const curName=t({week:'curW',month:'curM',year:'curY'}[u]),prevName=t({week:'prevW',month:'prevM',year:'prevY'}[u]);
  let N=u==='week'?8:u==='month'?6:5;
  if(u==='year'){const ys=txs.map(x=>+x.date.slice(0,4));const first=ys.length?Math.min(...ys):cur.sd.getFullYear();N=Math.min(5,Math.max(2,cur.sd.getFullYear()-first+1));}
  const items=[];for(let i=N-1;i>=0;i--){const p=period(u,-i);items.push({p,val:spend(p.s,p.e),cur:i===0});}
  const mxv=Math.max(...items.map(i=>i.val))||1;
  const bars=`<section class="card"><div class="wk" role="img" aria-label="${t('chartAria')}">${items.map(i=>`<div><small>${i.val?short(i.val):''}</small><i class="${i.cur?'cur':''}" style="height:${Math.round(i.val/mxv*62)+3}px"></i></div>`).join('')}</div><div class="wkl">${items.map(i=>`<div ${i.cur?'style="font-weight:700;color:var(--ink)"':''}>${pLabel(u,i.p,true)}</div>`).join('')}</div></section>`;
  const avgC=sc.curT/sc.n,avgP=sc.prevT/sc.pn;
  let peak=null;{const byD={};txs.forEach(x=>{if(x.type==='expense'&&x.date>=cur.s&&x.date<=sc.today)byD[x.date]=(byD[x.date]||0)+x.amount;});Object.entries(byD).forEach(([d,v])=>{if(!peak||v>peak[1])peak=[d,v];});}
  const summary=`<section class="card"><div class="ctitle"><span>${curName} · ${t('totExp')}</span></div>
  <div class="cmpv"><span>${curName} (${rng(cur.s,sc.today)})</span><b class="neg">${mny(sc.curT)}</b></div>
  <div class="cmpv"><span>${t('cmpSame',prevName,rng(sc.prev.s,sc.peS))}</span><b>${mny(sc.prevT)}</b></div>
  ${chgHtml(sc.curT,sc.prevT,true)}
  <div class="hint">${t('prevFull',prevName,mny(sc.prevFull))}</div>
  <div class="tiles" style="margin-top:12px"><div class="tile"><span>${t('avgDay')}</span><b>${mny(avgC)}</b><div style="margin-top:2px">${chgHtml(avgC,avgP)}</div></div><div class="tile"><span>${t('peakDay')}</span><b>${peak?mny(peak[1]):'—'}</b>${peak?`<div class="rs" style="margin-top:2px">${dLabel(peak[0])}</div>`:''}</div></div></section>`;
  const cc={};txs.forEach(x=>{if(x.type!=='expense')return;if(x.date>=cur.s&&x.date<=sc.today)(cc[x.category]=cc[x.category]||[0,0])[0]+=x.amount;else if(x.date>=sc.prev.s&&x.date<=sc.peS)(cc[x.category]=cc[x.category]||[0,0])[1]+=x.amount;});
  const cl=Object.entries(cc).map(([c,v])=>({c,cur:v[0],prev:v[1],d:v[0]-v[1]})).filter(r=>Math.round(r.d)!==0).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,6);
  const cats=cl.length?`<div class="lbl" style="margin-top:4px">${t('whatChanged')}</div><section class="card flush">${cl.map(r=>`<div class="row"><span class="ico exp" aria-hidden="true">${esc((ecats[r.c]&&ecats[r.c].icon)||'💸')}</span><span class="rmid"><span class="rt">${esc(lbl(r.c))}</span><span class="rs">${mny(r.cur)} ← ${mny(r.prev)}</span></span>${chgHtml(r.cur,r.prev)}</div>`).join('')}</section>`:'';
  const M=u==='year'?N:12,hist=[];
  for(let i=0;i<M;i++){const p=period(u,-i),val=i===0?sc.curT:spend(p.s,p.e),pp=period(u,-i-1),base=i===0?sc.prevT:spend(pp.s,pp.e);hist.push(`<div class="row"><span class="rmid"><span class="rt">${pLabel(u,p)}${i===0?` <span class="rs" style="display:inline">(${t('ongoing')})</span>`:''}</span></span><span style="text-align:right"><b>${mny(val)}</b><div>${i===M-1&&u!=='year'?'':chgHtml(val,base)}</div></span></div>`);}
  return `<div class="top"><div><div class="ptitle">${t('mCmp')}</div><div class="psub">${t('repExp')}</div></div></div>
  ${seg}
  <div class="seg"><button class="${u==='week'?'on':''}" onclick="S.cmpUnit='week';render()">${t('uWeek')}</button><button class="${u==='month'?'on':''}" onclick="S.cmpUnit='month';render()">${t('uMonth')}</button><button class="${u==='year'?'on':''}" onclick="S.cmpUnit='year';render()">${t('uYear')}</button></div>
  ${bars}${summary}${cats}

async function settleRP(id){

function openBal(date){

  const ob=loadOB(),hist=Object.entries(ob).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8);
  sheet(`<div class="sh-title">${t('balTitle')}</div><div class="sh-sub">${t('balSub')}</div>
  <label class="fld"><span>${t('dateL')}</span><input id="b-date" type="date" value="${d}" onchange="balFill()"></label>
  <div class="lbl" style="margin-top:0">${t('balWhen')}</div>
  <div class="seg" style="margin-top:0"><button id="bm-open" class="on" onclick="setBM('open')">${t('balMorn')}</button><button id="bm-now" onclick="setBM('now')">${t('balNow')}</button></div>
  ${ACC.map(a=>`<label class="fld"><span>${t('a_'+a)} (৳)</span><input id="b-${a}" type="number" inputmode="decimal" step="any" placeholder="0"></label>`).join('')}

function setBM(m){BSM=m;$('bm-open').classList.toggle('on',m==='open');$('bm-now').classList.toggle('on',m==='now');balFill();}
function balFill(){
  const d=$('b-date').value||todayStr(),ob=loadOB();
  const src=BSM==='open'?(ob[d]||openingOn(d)):closeOn(d);
  ACC.forEach(a=>{$('b-'+a).value=src?Math.round(src[a]*100)/100:'';});
}
function saveBal(){
  const d=$('b-date').value;if(!d){toast(t('pickDate'));return;}
  const v={},raw=ACC.map(a=>$('b-'+a).value.trim());
  if(raw.every(r=>r==='')){toast(t('balAmtErr'));return;}
  for(let i=0;i<3;i++){const n=raw[i]===''?0:parseFloat(raw[i]);if(isNaN(n)){toast(t('balAmtErr'));return;}v[ACC[i]]=n;}
  const open={};
  if(BSM==='now'){const n=netOn(d);ACC.forEach(a=>{open[a]=Math.round((v[a]-n[a])*100)/100;});}else ACC.forEach(a=>{open[a]=v[a];});
  const ob=loadOB();ob[d]=open;saveOB(ob);closeSheet();render();if($('layer-settings').classList.contains('open'))openSettings();toast(t('balSaved'));
}
async function delBal(d){
  if(!await ask(t('balRemoveQ'),t('balRemoveD'),t('del'),true))return;
  const ob=loadOB();delete ob[d];saveOB(ob);openBal();render();
}
function openTransfer(){

function trChips(){

function saveTransfer(){

  $('a-save').innerHTML=A.editId?t('update'):t('save');
}
function pickCat(i){const k=Object.keys(curCats())[i];A.cat=k;A.sub='';updAdd();}
function pickSub(i){const s=curCats()[A.cat].subs[i];A.sub=A.sub===s?'':s;updAdd();}
function calcEval(expr){
  let e=String(expr).replace(/−/g,'-').replace(/\s/g,'').replace(/[+\-.]+$/,'');
  if(!e||!/^[0-9+\-.]+$/.test(e))return null;
  try{const v=Function('"use strict";return ('+e+')')();return(typeof v==='number'&&isFinite(v))?Math.round(v*100)/100:null;}catch(_){return null;}
}
function updAmt(){
  const v=calcEval(A.expr),hasOp=/[+−]/.test(A.expr.replace(/^−/,''));
  $('a-expr').textContent=hasOp?nd(A.expr):'';
  const a=$('a-amt');a.textContent='৳'+(v===null?nd(0):nd(v.toLocaleString('en-IN')));
  a.className='bigamt '+((A.mode==='income'||A.mode==='rec')?'i':'e');
}
function padKey(k){
  if(k==='⌫')A.expr=A.expr.slice(0,-1);
  else if(k==='='){const v=calcEval(A.expr);if(v!==null)A.expr=String(v);}
  else if(k==='+'||k==='−'){if(!A.expr)return;A.expr=A.expr.replace(/[+−]$/,'')+k;}
  else if(k==='.'){const last=A.expr.split(/[+−]/).pop();if(last.includes('.'))return;A.expr+=last===''?'0.':'.';}
  else{const last=A.expr.split(/[+−]/).pop();if(last==='0'&&k!=='00'&&!last.includes('.'))A.expr=A.expr.slice(0,-1);if((last===''||last==='0')&&k==='00')return;if(A.expr.length>18)return;A.expr+=k;}
  updAmt();
}
function newCat(){
  const inc=A.mode==='income';
  sheet(`<div class="sh-title">${inc?t('newCatInc'):t('newCatExp')}</div><div class="sh-sub">${t('newCatSub')}</div>
  <div style="display:flex;gap:10px"><label class="fld" style="width:84px"><span>${t('picL')}</span><input id="nc-ic" type="text" maxlength="4" value="📌" style="text-align:center;font-size:22px"></label><label class="fld" style="flex:1"><span>${t('nameL')}</span><input id="nc-nm" type="text" maxlength="30" placeholder="${t('catPh')}" autocomplete="off"></label></div>
  <div class="sh-actions"><button class="btn" onclick="addCat()">${t('add')}</button><button class="btn sec" onclick="closeSheet()">${t('close')}</button></div>`);
}
function addCat(){
  const nm=$('nc-nm').value.trim(),ic=$('nc-ic').value.trim()||'📌',cs=curCats();
  if(!nm){toast(t('enterCat'));return;}
  if(cs[nm]){toast(t('exists'));return;}
  cs[nm]={icon:ic,subs:[]};saveAll();A.cat=nm;A.sub='';closeSheet();updAdd();toast(t('catAdded'));
}
function newSub(){
  sheet(`<div class="sh-title">${t('newSubTitle')}</div><div class="sh-sub">${t('insideCat',esc(lbl(A.cat)))}</div><label class="fld"><span>${t('nameL')}</span><input id="ns-nm" type="text" maxlength="30" placeholder="${t('subPh')}" autocomplete="off"></label>
  <div class="sh-actions"><button class="btn" onclick="addSub()">${t('add')}</button><button class="btn sec" onclick="closeSheet()">${t('close')}</button></div>`);
}
function addSub(){
  const nm=$('ns-nm').value.trim(),c=curCats()[A.cat];
  if(!nm){toast(t('enterName'));return;}
  if(c.subs.includes(nm)){toast(t('exists'));return;}
  c.subs.push(nm);saveAll();A.sub=nm;closeSheet();updAdd();
}
function saveAdd(){
  const amt=calcEval(A.expr);
  if(!amt||amt<=0){toast(t('enterAmt'));return;}
  if(isRP()){
    const name=A.name.trim();if(!name){toast(t('enterName'));return;}
    const rp=loadRP();rp.push({id:Date.now(),type:A.mode,name,amount:amt,due:A.due||'',note:A.note.trim(),status:'open',created:todayStr(),acct:A.acct});saveRP(rp);
    pref.last.acct=A.acct;savePref();
    S.rpTab=A.mode;closeAdd();go('baki');toast(t('saved'));return;
  }
  if(!A.cat){toast(t('pickCat'));return;}
  if(!A.date){toast(t('pickDate'));return;}
  const rec={type:A.mode,category:A.cat,subcategory:A.sub||'',amount:amt,date:A.date,note:A.note.trim(),acct:A.acct};
  if(A.editId){const x=txs.find(z=>z.id===A.editId);if(x)Object.assign(x,rec);}
  else txs.push(Object.assign({id:Date.now()},rec));
  pref.last[A.mode]=A.cat;pref.last.acct=A.acct;savePref();saveAll();
  const y=+A.date.slice(0,4),m=+A.date.slice(5,7)-1;if(y!==vY||m!==vM){vY=y;vM=m;}
  const msg=t(A.mode==='income'?(A.editId?'incUpd':'incSaved'):(A.editId?'expUpd':'expSaved'),mny(amt));
  closeAdd();render();toast(msg);
}

/* ═════════ SETTINGS ═════════ */
function srow(icon,title,desc,fn){return `<button class="srow" onclick="${fn}"><span class="si">${icon}</span><span class="sb"><b>${title}</b><small>${desc}</small></span><span style="color:var(--muted)">${I.arr}</span></button>`;}
function openSettings(){
  $('layer-settings').innerHTML=`<div class="set-h"><button class="iconbtn" onclick="closeSettings()" aria-label="${t('back')}">${I.back}</button><h2>${t('settings')}</h2></div><div class="set-body">
  <div class="sgroup">${t('sLang')}</div>
  <div class="srow" style="display:block"><div class="seg" style="margin:0"><button class="${LANG==='bn'?'on':''}" onclick="setLang('bn')">বাংলা</button><button class="${LANG==='en'?'on':''}" onclick="setLang('en')">English</button></div></div>
  <div class="sgroup">${t('sMoney')}</div>
  ${srow(I.wallet,t('sSetBal'),t('sSetBalD'),'openBal()')}
  ${srow(I.swap,t('sTr'),t('sTrD'),'openTransfer()')}
  <div class="srow" style="display:block"><b>${t('sWeek')}</b><div class="seg" style="margin:6px 0 0">${[[6,'dSat'],[0,'dSun'],[1,'dMon']].map(([v,l])=>`<button class="${pref.weekStart===v?'on':''}" onclick="setWeek(${v})">${t(l)}</button>`).join('')}</div></div>
  <div class="sgroup">${t('sBackup')}</div>
  ${srow(I.up,t('bkTake'),t('bkTakeD'),'exportBackup()')}
  ${srow(I.share,t('bkShare'),t('bkShareD'),'shareBackup()')}
  ${srow(I.down,t('bkRestore'),t('bkRestoreD'),'triggerImport()')}
  <div class="sgroup">${t('sLook')}</div>
  <div class="srow" style="display:block"><b>${t('sTheme')}</b><div class="seg" style="margin:6px 0 4px">${[['auto','tAuto'],['light','tLight'],['dark','tDark']].map(([m,l])=>`<button class="${pref.mode===m?'on':''}" onclick="setMode2('${m}')">${t(l)}</button>`).join('')}</div>
  <b style="display:block;margin-top:8px">${t('sAccent')}</b><div class="swatches">${ACCENTS.map(([c,n])=>`<button class="sw ${pref.accent===c?'on':''}" style="background:${c}" onclick="setAccent('${c}')" aria-label="${t(n)}">${pref.accent===c?I.check:''}</button>`).join('')}</div></div>
  <div class="sgroup">${t('sCats')}</div>
  ${srow(I.tag,t('catEdit'),t('catEditD'),"catMgr('expense')")}
  <div class="sgroup">${t('sUpdate')}</div>
  <div class="banner ${updatePending?'show':''}">${t('updBanner')}</div>
  ${srow(I.refresh,t('updPick'),t('updPickD'),'checkForUpdate()')}
  ${updatePending?srow(I.check,t('updApply'),t('updApplyD'),'applyUpdate()'):''}
  ${srow(I.info,t('updHow'),t('updHowD'),'howUpdate()')}
  <div class="sgroup" style="color:var(--exp)">${t('sDanger')}</div>
  <button class="srow" onclick="clearAll()"><span class="si" style="background:var(--exp-tint);color:var(--exp)">${I.trash}</span><span class="sb"><b style="color:var(--exp)">${t('clearT')}</b><small>${t('clearD')}</small></span></button>
  <div class="ver">${t('ver',nd(APP_VERSION))}</div></div>`;
  $('layer-settings').classList.add('open');
}
function closeSettings(){$('layer-settings').classList.remove('open');}
function setMode2(m){pref.mode=m;savePref();applyPref();openSettings();render();}
function setAccent(c){pref.accent=c;savePref();applyPref();openSettings();render();}
function setWeek(v){pref.weekStart=v;savePref();openSettings();render();}
function howUpdate(){
  sheet(`<div class="sh-title">${t('hwTitle')}</div><div class="sh-sub">${t('hwSub')}</div>
  ${[1,2,3].map(n=>`<div class="card"><b>${t('hw'+n)}</b><div class="hint" style="margin-top:2px">${t('hw'+n+'d')}</div></div>`).join('')}
  <div class="sh-actions"><button class="btn sec" onclick="closeSheet()">${t('gotIt')}</button></div>`);
}

function catMgr(kind,open){
  const cs=kind==='expense'?ecats:icats,def=kind==='expense'?DEFEC:DEFIC;
  sheet(`<div class="sh-title">${t('cmTitle')}</div>
  <div class="seg"><button class="${kind==='expense'?'on':''}" onclick="catMgr('expense')">${t('expense')}</button><button class="${kind==='income'?'on':''}" onclick="catMgr('income')">${t('income')}</button></div>
  <div class="card flush">${Object.entries(cs).map(([c,d],i)=>`<div class="row" style="flex-wrap:wrap"><span class="ico ${kind==='expense'?'exp':'inc'}" aria-hidden="true">${esc(d.icon||'📌')}</span><span class="rmid"><span class="rt">${esc(lbl(c))}</span><span class="rs">${d.subs.length?t('nSub',nd(d.subs.length)):t('noSub')}</span></span><button class="btn sm sec" onclick="catMgr('${kind}',${open===i?-1:i})">${open===i?t('close'):t('editB')}</button>
  ${open===i?`<div style="width:100%;padding:6px 0 10px"><div class="chips">${d.subs.map((s,j)=>`<span class="chip">${esc(lbl(s))}<button onclick="delSubCat('${kind}',${i},${j})" aria-label="${t('del')}" style="min-width:32px;min-height:32px;color:var(--exp)">✕</button></span>`).join('')}</div>
  <div style="display:flex;gap:8px"><input class="inp" id="sub-in" type="text" maxlength="30" placeholder="${t('subNew')}" autocomplete="off"><button class="btn sm" onclick="addSubCat('${kind}',${i})">${t('addS')}</button></div>
  ${def[c]?`<div class="hint">${t('builtin')}</div>`:`<button class="btn sm dng" style="margin-top:10px" onclick="delCat('${kind}',${i})">${I.trash} ${t('delCatBtn')}</button>`}</div>`:''}</div>`).join('')}</div>
  <div class="lbl">${t('newCatL')}</div><div style="display:flex;gap:8px"><input class="inp" id="mc-ic" type="text" maxlength="4" value="📌" style="width:64px;text-align:center;font-size:22px"><input class="inp" id="mc-nm" type="text" maxlength="30" placeholder="${t('nameShort')}" autocomplete="off"><button class="btn sm" onclick="addCatMgr('${kind}')">${t('addS')}</button></div>
  <div class="sh-actions"><button class="btn sec" onclick="closeSheet()">${t('done')}</button></div>`);
}
function addCatMgr(kind){const cs=kind==='expense'?ecats:icats,nm=$('mc-nm').value.trim(),ic=$('mc-ic').value.trim()||'📌';if(!nm){toast(t('enterName'));return;}if(cs[nm]){toast(t('exists'));return;}cs[nm]={icon:ic,subs:[]};saveAll();catMgr(kind);}
function addSubCat(kind,i){const cs=kind==='expense'?ecats:icats,k=Object.keys(cs)[i],nm=$('sub-in').value.trim();if(!nm)return;if(cs[k].subs.includes(nm)){toast(t('exists'));return;}cs[k].subs.push(nm);saveAll();catMgr(kind,i);}
function delSubCat(kind,i,j){const cs=kind==='expense'?ecats:icats,k=Object.keys(cs)[i];cs[k].subs.splice(j,1);saveAll();catMgr(kind,i);}
async function delCat(kind,i){
  const cs=kind==='expense'?ecats:icats,k=Object.keys(cs)[i];
  if(!await ask(t('delCatQ'),t('delCatD',lbl(k)),t('del'),true))return;
  delete cs[k];saveAll();catMgr(kind);
}

function buildBackup(){return JSON.stringify({app:'taka-gelo-koi',version:APP_VERSION,exported:new Date().toISOString(),txs,ecats,icats,rp:loadRP(),ob2:loadOB()},null,2);}
function backupName(){const d=new Date();return `taka-gelo-koi-backup-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.json`;}
function exportBackup(){
  const json=buildBackup(),name=backupName();
  if(Android.call('saveBackup',json,name))return;
  const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(json);a.download=name;a.click();toast(t('bkDownloaded'));
}
function shareBackup(){
  const json=buildBackup(),name=backupName();
  if(Android.call('shareBackup',json,name))return;
  if(navigator.share){const f=new File([new Blob([json],{type:'application/json'})],name,{type:'application/json'});navigator.share({files:[f],title:t('bkSubj')}).catch(()=>{});}
  else exportBackup();
}
function triggerImport(){if(!Android.call('openFilePicker'))$('import-file').click();}
function importFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>performImport(ev.target.result);r.readAsText(f);e.target.value='';}
async function performImport(str){
  let d;
  try{d=JSON.parse(str);if(!d||!Array.isArray(d.txs)||!d.ecats||!d.icats)throw new Error('bad');}
  catch(_){toast(t('bkBad'));return;}
  if(!await ask(t('restoreQ'),t('restoreD',nd(d.txs.length)),t('restoreOk'),true))return;
  txs=d.txs;ecats=d.ecats;icats=d.icats;
  if(Array.isArray(d.rp))saveRP(d.rp);
  if(d.ob2&&typeof d.ob2==='object')saveOB(d.ob2);
  else if(d.ob&&typeof d.ob==='object'){const o={};Object.keys(d.ob).forEach(k=>{if(typeof d.ob[k]==='number')o[k]={wallet:d.ob[k],bkash:0,bank:0};});saveOB(o);}
  saveAll();closeSettings();render();toast(t('restored',nd(d.txs.length)));
}

function checkForUpdate(){
  if(Android.call('checkForUpdate'))return;
  toast(t('updAndroid'));
}
async function applyUpdate(){
  if(!await ask(t('applyQ'),t('applyD'),t('applyOk')))return;
  toast(t('updating'));setTimeout(()=>Android.call('applyUpdate'),300);
}
async function clearAll(){
  if(!await ask(t('clr1Q'),t('clr1D'),t('clr1Ok'),true))return;
  if(!await ask(t('clr2Q'),t('clr2D'),t('clr2Ok'),true))return;
  txs=[];ecats=clone(DEFEC);icats=clone(DEFIC);saveAll();saveRP([]);saveOB({});closeSettings();render();toast(t('cleared'));
}

/* ═════════ INIT ═════════ */
loadAll();applyPref();applyLang();
if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(pref.mode==='auto')applyPref();});}catch(_){}}
render();
</script>
